<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 RINTU</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a1a;
            min-height: 100vh;
            padding: 16px;
            background-image: radial-gradient(ellipse at 10% 20%, rgba(120,80,255,0.15) 0%, transparent 50%);
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container { max-width: 850px; width: 100%; margin: 0 auto; }
        .header { text-align: center; padding: 20px 0; }
        .header h1 {
            font-size: 2.8em;
            font-weight: 900;
            background: linear-gradient(135deg, #ff6b9d, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .sub { color: rgba(255,255,255,0.3); letter-spacing: 3px; font-size: 0.8em; }
        .card {
            background: rgba(22,22,50,0.75);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .card-title { font-size: 0.75em; text-transform: uppercase; letter-spacing: 3px; color: rgba(255,255,255,0.3); margin-bottom: 14px; }
        .token-area textarea {
            width: 100%;
            min-height: 120px;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(0,0,0,0.3);
            color: #e2e8f0;
            font-size: 0.8em;
            font-family: 'Courier New', monospace;
            outline: none;
            resize: vertical;
        }
        .token-area textarea:focus { border-color: rgba(192,132,252,0.3); }
        .token-stats { display: flex; gap: 15px; flex-wrap: wrap; font-size: 0.8em; color: rgba(255,255,255,0.4); }
        .token-stats span { background: rgba(255,255,255,0.05); padding: 4px 12px; border-radius: 20px; }
        .token-stats .count { color: #c084fc; font-weight: 600; }
        .token-stats .online { color: #34d399; }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .status-left { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
        .status-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
            transition: all 0.3s;
        }
        .status-dot.online { background: #34d399; box-shadow: 0 0 20px rgba(52,211,153,0.5); }
        .status-dot.offline { background: #f87171; box-shadow: 0 0 20px rgba(248,113,113,0.3); }
        .status-text { font-weight: 600; font-size: 1em; }
        .status-text.online { color: #34d399; }
        .status-text.offline { color: #f87171; }
        .status-badge { font-size: 0.7em; padding: 4px 14px; border-radius: 20px; background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.6); }
        .status-badge span { color: #c084fc; font-weight: 600; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn:active { transform: scale(0.95); }
        .btn-start { background: linear-gradient(135deg, #34d399, #059669); color: #fff; }
        .btn-start:hover { transform: translateY(-2px); }
        .btn-stop { background: linear-gradient(135deg, #f87171, #dc2626); color: #fff; }
        .btn-stop:hover { transform: translateY(-2px); }
        .btn-glow { background: linear-gradient(135deg, #c084fc, #7c3aed); color: #fff; }
        .btn-glow:hover { transform: translateY(-2px); }
        .btn-save { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #1a1a2e; }
        .btn-save:hover { transform: translateY(-2px); }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
        .btn-danger:hover { transform: translateY(-2px); }
        .now-playing {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 18px;
            background: rgba(0,0,0,0.3);
            border-radius: 14px;
            margin-top: 12px;
        }
        .now-playing .title { font-weight: 600; color: #e2e8f0; }
        .cmd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 8px; }
        .cmd-btn {
            padding: 10px 6px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.03);
            color: rgba(255,255,255,0.7);
            font-size: 0.7em;
            cursor: pointer;
            text-align: center;
            transition: all 0.25s;
        }
        .cmd-btn:hover { background: rgba(192,132,252,0.12); transform: translateY(-2px); }
        .cmd-btn .icon { font-size: 1.4em; display: block; margin-bottom: 3px; }
        .input-row { display: flex; gap: 10px; margin-top: 4px; }
        .input-row input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(0,0,0,0.3);
            color: #e2e8f0;
            font-size: 0.9em;
            outline: none;
        }
        .input-row input:focus { border-color: rgba(192,132,252,0.3); }
        .log-area {
            background: rgba(0,0,0,0.4);
            border-radius: 14px;
            padding: 14px;
            max-height: 250px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.75em;
            line-height: 1.8;
        }
        .log-entry .time { color: rgba(255,255,255,0.2); margin-right: 10px; }
        .log-entry .sys { color: rgba(255,255,255,0.3); }
        .log-entry .resp { color: #34d399; }
        .log-entry .err { color: #f87171; }
        .token-area { display: flex; flex-direction: column; gap: 10px; }
        .join-box { display: flex; gap: 10px; flex-wrap: wrap; }
        .join-box input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.06); background: rgba(0,0,0,0.3); color: #fff; outline: none; min-width: 150px; }
        .join-box input:focus { border-color: rgba(192,132,252,0.3); }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            padding: 12px 24px;
            border-radius: 12px;
            color: #fff;
            font-size: 0.9em;
            display: none;
            z-index: 999;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .toast.show { display: block; animation: fadeUp 0.3s ease; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .warning {
            background: rgba(251,191,36,0.1);
            border: 1px solid rgba(251,191,36,0.2);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.8em;
            color: #fbbf24;
            margin-top: 8px;
        }
        @media (max-width: 600px) {
            .header h1 { font-size: 1.8em; }
            .status-bar { flex-direction: column; }
            .cmd-grid { grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); }
            .now-playing { flex-direction: column; text-align: center; }
            .input-row { flex-direction: column; }
            .join-box { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🌸 RINTU</h1>
        <div class="sub">✦ Selfbot Controller ✦</div>
    </div>

    <div class="card">
        <div class="card-title">🔑 Tokens (<span id="tokenCountDisplay">0</span> loaded | <span id="onlineCountDisplay" style="color:#34d399;">0</span> online)</div>
        <div class="token-area">
            <textarea id="tokenInput" placeholder="Paste tokens (one per line)"></textarea>
            <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;">
                <div class="token-stats">
                    <span>📊 <span class="count" id="tokenCount">0</span></span>
                    <span>🟢 <span class="online" id="onlineCount">0</span> online</span>
                </div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                    <button class="btn btn-save" id="saveBtn">💾 Save</button>
                    <button class="btn btn-glow" id="loadBtn">📂 Load</button>
                    <button class="btn btn-danger" id="clearBtn">🗑️ Clear</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">🎯 Join Server</div>
        <div class="join-box">
            <input id="inviteInput" placeholder="https://discord.gg/invite">
            <button class="btn btn-glow" id="joinBtn">🚀 Join</button>
        </div>
    </div>

    <div class="card">
        <div class="status-bar">
            <div class="status-left">
                <span class="status-dot offline" id="statusDot"></span>
                <span class="status-text offline" id="statusText">OFFLINE</span>
                <span class="status-badge">🤖 <span id="botCount">0</span></span>
            </div>
            <div class="btn-group">
                <button class="btn btn-start" id="startBtn">▶ START</button>
                <button class="btn btn-danger" id="stopBtn">■ STOP</button>
            </div>
        </div>
        <div class="warning">
            ⚠️ Voice is NOT supported for selfbots. Use <strong>&lt;channel_id&gt;</strong> to send messages or <strong>say &lt;channel_id&gt; &lt;message&gt;</strong>
        </div>
    </div>

    <div class="card">
        <div class="card-title">⚡ Commands</div>
        <div class="cmd-grid">
            <button class="cmd-btn" data-cmd="help"><span class="icon">❓</span><span class="label">Help</span></button>
        </div>
    </div>

    <div class="card">
        <div class="card-title">⌨️ Command</div>
        <div class="input-row">
            <input id="cmdInput" placeholder="channel_id OR say channel_id message">
            <button class="btn btn-glow" id="sendBtn">Send ✦</button>
        </div>
    </div>

    <div class="card">
        <div class="card-title">📋 Log</div>
        <div class="log-area" id="logArea">
            <div class="log-entry"><span class="time">[✦]</span> <span class="sys">🌸 RINTU ready</span></div>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
let socket = io();

function showToast(msg, type) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.style.borderColor = type === 'error' ? '#f87171' : '#34d399';
    toast.className = 'toast show';
    setTimeout(() => { toast.className = 'toast'; }, 3000);
}

function getTokens() {
    const text = document.getElementById('tokenInput').value;
    const lines = text.split('\n');
    const result = [];
    for (let i = 0; i < lines.length; i++) {
        const token = lines[i].trim();
        if (token.length > 10 && token !== '') {
            result.push(token);
        }
    }
    return result;
}

function updateTokenStats() {
    const tokens = getTokens();
    document.getElementById('tokenCount').textContent = tokens.length;
    document.getElementById('tokenCountDisplay').textContent = tokens.length;
}

document.getElementById('tokenInput').addEventListener('input', updateTokenStats);

document.getElementById('saveBtn').onclick = () => {
    const tokens = getTokens();
    if (tokens.length === 0) { showToast('No tokens to save!', 'error'); return; }
    try {
        localStorage.setItem('rintu_tokens', JSON.stringify(tokens));
        showToast('Saved ' + tokens.length + ' tokens!', 'success');
        addLog('💾 Saved ' + tokens.length + ' tokens', 'resp');
    } catch (e) {
        showToast('Error: ' + e.message, 'error');
    }
};

document.getElementById('loadBtn').onclick = () => {
    try {
        const saved = localStorage.getItem('rintu_tokens');
        if (!saved) { showToast('No saved tokens!', 'error'); return; }
        const tokens = JSON.parse(saved);
        if (tokens && tokens.length > 0) {
            document.getElementById('tokenInput').value = tokens.join('\n');
            updateTokenStats();
            showToast('Loaded ' + tokens.length + ' tokens!', 'success');
            addLog('📂 Loaded ' + tokens.length + ' tokens', 'resp');
        }
    } catch (e) {
        showToast('Error: ' + e.message, 'error');
    }
};

document.getElementById('clearBtn').onclick = () => {
    document.getElementById('tokenInput').value = '';
    updateTokenStats();
    localStorage.removeItem('rintu_tokens');
    showToast('Cleared all tokens!', 'success');
    addLog('🗑️ Tokens cleared', 'sys');
};

(function() {
    try {
        const saved = localStorage.getItem('rintu_tokens');
        if (saved) {
            const tokens = JSON.parse(saved);
            if (tokens && tokens.length > 0) {
                document.getElementById('tokenInput').value = tokens.join('\n');
                updateTokenStats();
                setTimeout(() => addLog('📂 Auto-loaded ' + tokens.length + ' tokens', 'sys'), 500);
            }
        }
    } catch (e) {}
})();

function addLog(msg, type) {
    if (!type) type = 'sys';
    const time = new Date().toLocaleTimeString();
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = `<span class="time">[${time}]</span> <span class="${type}">${msg}</span>`;
    document.getElementById('logArea').appendChild(entry);
    document.getElementById('logArea').scrollTop = document.getElementById('logArea').scrollHeight;
}

function updateStatus(running, count, online) {
    const dot = document.getElementById('statusDot');
    const text = document.getElementById('statusText');
    dot.className = 'status-dot ' + (running ? 'online' : 'offline');
    text.className = 'status-text ' + (running ? 'online' : 'offline');
    text.textContent = running ? '🟢 ONLINE' : '🔴 OFFLINE';
    document.getElementById('botCount').textContent = count || 0;
    document.getElementById('onlineCount').textContent = online || 0;
    document.getElementById('onlineCountDisplay').textContent = online || 0;
}

socket.on('connect', () => addLog('🔌 Connected to server', 'sys'));

socket.on('status_update', (d) => updateStatus(d.isRunning, d.botCount, d.onlineCount));

socket.on('bots_started', (d) => addLog('🚀 Started ' + d.count + ' bots', 'resp'));

socket.on('bots_stopped', () => { addLog('⛔ Bots stopped', 'err'); updateStatus(false, 0, 0); });

socket.on('bot_status', (d) => addLog('🤖 Bot ' + d.index + '/' + d.total + ': ' + d.tag + ' ✅', 'resp'));

socket.on('online_update', (d) => {
    document.getElementById('onlineCount').textContent = d.online;
    document.getElementById('onlineCountDisplay').textContent = d.online;
});

socket.on('command_response', (d) => {
    const isErr = d.response.indexOf('❌') !== -1 || d.response.indexOf('✖') !== -1;
    addLog('✦ ' + d.command + ' → ' + d.response, isErr ? 'err' : 'resp');
});

document.getElementById('startBtn').onclick = () => {
    addLog('▶️ START clicked!', 'sys');
    const tokens = getTokens();
    addLog('📊 Found ' + tokens.length + ' tokens', 'sys');
    if (tokens.length === 0) { showToast('Add tokens first!', 'error'); addLog('❌ No tokens', 'err'); return; }
    localStorage.setItem('rintu_tokens', JSON.stringify(tokens));
    addLog('📤 Sending ' + tokens.length + ' tokens to server...', 'sys');
    fetch('/api/start-bots', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tokens: tokens })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            addLog('✅ ' + data.count + ' bots starting', 'resp');
            showToast('Starting ' + data.count + ' bots!', 'success');
        } else {
            addLog('❌ ' + data.error, 'err');
            showToast('Error: ' + data.error, 'error');
        }
    })
    .catch(e => { addLog('❌ Error: ' + e.message, 'err'); showToast('Error: ' + e.message, 'error'); });
};

document.getElementById('stopBtn').onclick = () => {
    addLog('⏹️ STOP clicked!', 'sys');
    fetch('/api/stop-bots', { method: 'POST', headers: { 'Content-Type': 'application/json' } })
    .then(r => r.json())
    .then(data => { if (data.success) { addLog('✅ Bots stopped', 'sys'); showToast('Bots stopped', 'success'); } })
    .catch(e => addLog('❌ Error: ' + e.message, 'err'));
};

document.getElementById('joinBtn').onclick = () => {
    const invite = document.getElementById('inviteInput').value.trim();
    if (!invite) { showToast('Enter invite link!', 'error'); return; }
    addLog('🔗 Joining server: ' + invite, 'sys');
    fetch('/api/join-server', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ invite: invite })
    })
    .then(r => r.json())
    .then(data => {
        if (data.message) { addLog('✅ ' + data.message, 'resp'); showToast('Joined server!', 'success'); }
        if (data.error) { addLog('❌ ' + data.error, 'err'); showToast('Error: ' + data.error, 'error'); }
    })
    .catch(e => addLog('❌ Error: ' + e.message, 'err'));
};

function sendCmd(cmd) {
    if (!cmd) return;
    addLog('📤 Sending: ' + cmd, 'sys');
    fetch('/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ command: cmd })
    })
    .then(r => r.json())
    .then(d => {
        if (d.response) {
            const isErr = d.response.indexOf('❌') !== -1 || d.response.indexOf('✖') !== -1;
            addLog('📥 ' + d.response, isErr ? 'err' : 'resp');
            if (!isErr) showToast(d.response, 'success');
        }
    })
    .catch(e => addLog('❌ Error: ' + e.message, 'err'));
}

document.getElementById('sendBtn').onclick = () => {
    const inp = document.getElementById('cmdInput');
    sendCmd(inp.value.trim());
    inp.value = '';
};

document.getElementById('cmdInput').onkeypress = (e) => {
    if (e.key === 'Enter') document.getElementById('sendBtn').click();
};

document.querySelectorAll('.cmd-btn').forEach(btn => {
    btn.onclick = () => {
        const cmd = btn.dataset.cmd;
        sendCmd(cmd);
    };
});

fetch('/api/status').then(r => r.json()).then(d => updateStatus(d.isRunning, d.botCount, d.onlineCount)).catch(console.error);
</script>
</body>
</html>
